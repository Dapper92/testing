name: CI

on:
  push:
    branches:
            - origin
permissions:
          contents: write
jobs: 
    building:
        runs-on: ubuntu-latest
       

        steps:
        - name: "Checkout code"
          uses: actions/checkout@v4
          
        - name: "Build Docker image"
          run: |
            docker build -t dapper92/testing-docker:1.2.1 .

        - name: "Login to Docker Hub"
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}
            
        - name: Push Docker image
         # git clone https://github.com/Oluwaseun186/testcluster.git testcluster
          run: |
            docker push dapper92/testing-docker:1.2.1
            
 
        - name: Go to the repo for Helm
          env:
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
          run: |
            git config --global user.email "oladapper@gmail.com"
            git config --global user.name "Oladapper"
            git clone https://github.com/Oluwaseun186/testcluster.git testcluster
            cd testcluster/templates

            sed -i 's/testing/testings/' deployment.yaml
            sed -i 's/testing/testings/' service.yaml
            cat deployment.yaml
            git remote add testcluster https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Oluwaseun186/testcluster.git
            git add .
            git commit -m "Updated helm 1"
            git push https://adewumibode7:${GH_TOKEN}@github.com/Oluwaseun186/testcluster origin

                  